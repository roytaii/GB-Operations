<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Inventory — Prototype</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel-2:#fafbfc; --text:#12171d; --muted:#5f6b78;
  --line:#dfe4e9; --line-2:#eceff2; --accent:#b45309; --accent-bg:#fdf3e7;
  --good:#0f7a5a; --good-bg:#e8f6f1; --bad:#b42318; --bad-bg:#fdecea;
  --warn:#b54708; --warn-bg:#fdf1e6; --info:#1b5fa8; --info-bg:#eaf2fb;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:7px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1216; --panel:#151b21; --panel-2:#1a2129; --text:#e6ecf2; --muted:#8b97a4;
    --line:#242d37; --line-2:#1d252d; --accent:#f0a13a; --accent-bg:#2a2013;
    --good:#4ec9a0; --good-bg:#12271f; --bad:#f6867c; --bad-bg:#2b1614;
    --warn:#e8a34c; --warn-bg:#2a1f12; --info:#6cb0f0; --info-bg:#12212f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);
     -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

/* ── chrome ─────────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;display:flex;gap:14px;align-items:center;
     padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.brand small{font-weight:450;color:var(--muted);font-size:11px;
             border:1px solid var(--line);padding:1px 6px;border-radius:20px}
.searchwrap{position:relative;flex:1;max-width:620px}
#q{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);
   background:var(--panel-2);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.searchwrap .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.kbd{font:11px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;
     border-radius:4px;padding:3px 5px;color:var(--muted);background:var(--panel-2)}
.top .spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:var(--r);
       padding:7px 11px;cursor:pointer;color:var(--muted);white-space:nowrap}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.shell{display:grid;grid-template-columns:196px 1fr;min-height:calc(100vh - 57px)}
nav{border-right:1px solid var(--line);padding:12px 8px;background:var(--panel);
    position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
         padding:12px 10px 5px;font-weight:600}
nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;
      text-decoration:none;color:var(--text);cursor:pointer}
nav a:hover{background:var(--panel-2)}
nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav a .n{margin-left:auto;font:11px/1 var(--mono);color:var(--muted)}
nav a.on .n{color:var(--accent)}
main{padding:20px 22px 60px;max-width:1180px;overflow-x:hidden}

/* ── generic ────────────────────────────────────────────────────────────── */
h1{font-size:19px;margin:0 0 3px;letter-spacing:-.3px}
h2{font-size:14px;margin:22px 0 9px;letter-spacing:-.1px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;box-shadow:var(--shadow)}
.cards{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.stat{font:600 24px/1.1 var(--sans);letter-spacing:-.5px;margin:2px 0 0}
.stat.sm{font-size:18px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--sans);
     text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:5px;
     background:var(--line-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.acc{background:var(--accent-bg);color:var(--accent)}
.zone-FRZ{background:var(--info-bg);color:var(--info)}
.zone-CLR{background:var(--good-bg);color:var(--good)}
.zone-DRY{background:var(--warn-bg);color:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.07em;
   color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--panel-2)}
tr.click{cursor:pointer}
.num{text-align:right;font-family:var(--mono)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tw table{min-width:560px}
.tw tbody tr:last-child td{border-bottom:none}

.id{font-family:var(--mono);font-size:12.5px;color:var(--accent);cursor:pointer;
    text-decoration:none;border-bottom:1px dotted transparent}
.id:hover{border-bottom-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

/* ── forms ──────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input,.field select{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
                           background:var(--panel-2);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.field input.big{font:600 17px/1.2 var(--mono);padding:12px 13px;letter-spacing:.4px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);
     padding:10px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme:dark){.btn{color:#151b21}}
.hint{font-size:11.5px;color:var(--muted)}
.flash{margin-top:12px;padding:10px 12px;border-radius:var(--r);font-size:13px;
       background:var(--good-bg);color:var(--good);border:1px solid currentColor}
.flash.err{background:var(--bad-bg);color:var(--bad)}

/* ── search results ─────────────────────────────────────────────────────── */
.res{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;
     border:1px solid transparent}
.res:hover,.res.sel{background:var(--panel-2);border-color:var(--line)}
.res .kind{width:74px;flex:none}
.res .main{flex:1;min-width:0}
.res .t{font-family:var(--mono);font-size:13px;font-weight:600}
.res .d{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .r{flex:none;text-align:right;font-size:12px;color:var(--muted)}

/* ── warehouse map ──────────────────────────────────────────────────────── */
.aisle{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.aisle .nm{width:58px;flex:none;font:600 11px/1 var(--mono);color:var(--muted);padding-top:9px}
.bays{display:flex;gap:4px;flex-wrap:wrap}
.bay{display:flex;flex-direction:column-reverse;gap:2px}
.bay .bn{font:9px/1 var(--mono);color:var(--muted);text-align:center;margin-top:3px}
.slot{width:24px;height:15px;border-radius:3px;border:1px solid var(--line);
      background:var(--panel);cursor:pointer}
.slot:hover{outline:2px solid var(--accent);outline-offset:1px}
.slot.p1{background:var(--accent-bg);border-color:var(--accent)}
.slot.p2{background:var(--accent);border-color:var(--accent)}
.slot.over{background:var(--bad);border-color:var(--bad)}
.slot.blocked{background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 3px,var(--line) 3px,var(--line) 6px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 0 4px}
.legend i{display:inline-block;width:15px;height:11px;border-radius:2px;border:1px solid var(--line);
          vertical-align:-1px;margin-right:5px}

/* ── drawer ─────────────────────────────────────────────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(10,14,18,.42);z-index:50;opacity:0;
       pointer-events:none;transition:opacity .16s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:60;
        background:var(--panel);border-left:1px solid var(--line);overflow:auto;
        transform:translateX(102%);transition:transform .19s cubic-bezier(.3,.7,.3,1);
        box-shadow:-8px 0 30px rgba(10,14,18,.14)}
#drawer.on{transform:none}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
       padding:14px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.dhead .x{margin-left:auto;background:none;border:none;font-size:20px;line-height:1;
          cursor:pointer;color:var(--muted);padding:0 2px}
.dbody{padding:16px 18px 60px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px;margin:0 0 6px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.kv dd.plain{font-family:var(--sans);font-size:13px}
.dbody .tw table{min-width:420px}
.dbody td,.dbody th{padding:7px 9px}

/* ── timeline ───────────────────────────────────────────────────────────── */
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line-2)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;
               border-radius:50%;background:var(--muted);border:2px solid var(--panel)}
.tl li.in::before{background:var(--info)} .tl li.out::before{background:var(--good)}
.tl li.bad::before{background:var(--bad)} .tl li.warn::before{background:var(--warn)}
.tl .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .ty{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em}
.tl .ts{font:11px/1 var(--mono);color:var(--muted)}
.tl .d{font-size:12.5px;color:var(--muted);margin-top:3px}

@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:none;
      border-bottom:1px solid var(--line);padding:8px}
  nav .grp{display:none} nav a{white-space:nowrap} nav a .n{display:none}
  main{padding:16px 14px 50px}
  .top{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span>Warehouse <small>PROTOTYPE</small></div>
  <div class="searchwrap">
    <span class="ic">⌕</span>
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="Scan or type anything — pallet, case, lot, SKU, slot, trailer, order…">
  </div>
  <span class="kbd">/</span>
  <div class="spacer"></div>
  <button class="ghost" id="reset">Reset demo data</button>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-live="polite"></aside>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   Warehouse Inventory — working prototype
   Implements §1–§6 of inventory-data-model-example.md.

   Model:  TRAILER → PALLET (LPN) → cases, by LOT → LOCATION
   Truth:  one append-only EVENT table. Everything else is derived —
           on-hand, current location, and status are never stored.
   Store:  localStorage. Swap for a real API later; the derive layer
           below is the only thing that has to keep working.
   ══════════════════════════════════════════════════════════════════════════ */

const STORE_KEY = "wh.prototype.v1";

/* ── event vocabulary ───────────────────────────────────────────────────── */
// moves : does this relocate the pallet itself?
// cls   : timeline colour
const ET = {
  ARRIVED:      {moves:1, cls:"in",   label:"Arrived"},
  RECEIVED:     {moves:1, cls:"in",   label:"Received"},
  PUTAWAY:      {moves:1, cls:"in",   label:"Put away"},
  MOVED:        {moves:1, cls:"",     label:"Moved"},
  PICKED:       {moves:0, cls:"out",  label:"Picked"},
  STAGED:       {moves:1, cls:"out",  label:"Staged"},
  LOADED:       {moves:1, cls:"out",  label:"Loaded"},
  DEPARTED:     {moves:1, cls:"out",  label:"Departed"},
  DELIVERED:    {moves:1, cls:"out",  label:"Delivered"},
  COUNTED:      {moves:0, cls:"warn", label:"Counted"},
  ADJUSTED:     {moves:0, cls:"warn", label:"Adjusted"},
  DAMAGED:      {moves:0, cls:"bad",  label:"Damaged"},
  DISPOSED:     {moves:0, cls:"bad",  label:"Disposed"},
  RETURNED:     {moves:1, cls:"warn", label:"Returned"},
  HOLD_PLACED:  {moves:0, cls:"bad",  label:"Hold placed"},
  HOLD_RELEASED:{moves:0, cls:"good", label:"Hold released"},
};

/* ══════════════════════════════════════════════════════════════════════════
   SEED DATA — deterministic, so the demo looks the same every time
   ══════════════════════════════════════════════════════════════════════════ */
function rng(seed){ return function(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};}

const ITEMS = [
  ["SEA-SHR-1620-40","Shrimp, Raw Shell-On Tail-On, Extra Jumbo 16-20 ct","Waterfront Bistro","Frozen Seafood","FRZ","20/2LB",40,60,24,0,1],
  ["SEA-SAL-FIL-20", "Salmon Fillet, Atlantic, Skin-On 6 oz","Blue Harbor","Frozen Seafood","FRZ","40/8OZ",20,72,18,0,1],
  ["MEA-BEE-CHU-60", "Beef Chuck Roll, Choice, Boneless","Prairie Cut","Frozen Meat","FRZ","4/15LB",60,40,12,1,0],
  ["MEA-CHK-BRS-40", "Chicken Breast, Boneless Skinless, IQF","Golden Valley","Frozen Poultry","FRZ","4/10LB",40,54,12,0,0],
  ["FRZ-FRY-STK-30", "French Fries, Straight Cut 3/8\"","Northfield Farms","Frozen Potato","FRZ","6/5LB",30,64,24,0,0],
  ["FRZ-DUM-PRK-30", "Dumplings, Pork & Cabbage","Lucky Panda","Frozen Prepared","FRZ","6/5LB",30,56,18,0,0],
  ["CLR-CHZ-MOZ-40", "Cheese, Mozzarella, Low-Moisture Part Skim","Casa Bianca","Dairy","CLR","8/5LB",40,49,6,0,1],
  ["CLR-BUT-UNS-36", "Butter, Unsalted, Solid Print","Meadowbrook","Dairy","CLR","36/1LB",36,64,4,0,0],
  ["CLR-EGG-LRG-45", "Eggs, Grade A Large, Shell","Sunny Acres","Dairy","CLR","15/2.5DZ",45,36,1,0,1],
  ["PRO-ONI-YEL-50", "Onions, Yellow, Jumbo","Field & Furrow","Produce","CLR","1/50LB",50,40,2,0,0],
  ["PRO-LET-ROM-24", "Lettuce, Romaine Hearts","GreenLine","Produce","CLR","12/3CT",24,42,1,0,1],
  ["PRO-TOM-ROM-25", "Tomatoes, Roma 5x6","Sunridge","Produce","CLR","1/25LB",25,48,1,0,0],
  ["DRY-RIC-JAS-50", "Rice, Jasmine, Long Grain","Mekong Gold","Dry Grocery","DRY","1/50LB",50,48,36,0,0],
  ["DRY-OIL-CAN-35", "Oil, Canola, Frying","Chef's Reserve","Dry Grocery","DRY","6/1GAL",35,40,18,0,0],
  ["DRY-FLR-APR-50", "Flour, All Purpose, Enriched","Millstone","Dry Grocery","DRY","1/50LB",50,48,12,0,0],
  ["DRY-SAU-SOY-40", "Sauce, Soy, Naturally Brewed","Mekong Gold","Dry Grocery","DRY","6/0.5GAL",40,40,24,0,0],
].map(a=>({sku:a[0],desc:a[1],brand:a[2],category:a[3],zone:a[4],pack:a[5],
           netWt:a[6],perPallet:a[7],shelfLifeMo:a[8],catchWeight:!!a[9],ftl:!!a[10]}));

const VENDORS = [
  ["VEN-1042","Pacific Rim Seafood Imports","Vietnam"],
  ["VEN-1077","Heartland Protein Co.","USA"],
  ["VEN-1103","Valley Fresh Produce","USA / Mexico"],
  ["VEN-1150","Continental Dry Goods","USA"],
  ["VEN-1188","Northstar Dairy Supply","USA"],
].map(a=>({id:a[0],name:a[1],origin:a[2]}));

const CUSTOMERS = [
  ["CUST-2501","Golden Wok Restaurant Group","Route B"],
  ["CUST-2588","Marina Bay Hotel Kitchens","Route B"],
  ["CUST-2601","Sunrise Cafeteria Services","Route A"],
  ["CUST-2640","Pho Saigon (4 locations)","Route A"],
  ["CUST-2702","Riverside Country Club","Route C"],
].map(a=>({id:a[0],name:a[1],route:a[2]}));

const ZONES = {
  FRZ:{name:"Freezer",  temp:"−10°F to 0°F",  aisles:["A","B","C","D"], bays:8, levels:3},
  CLR:{name:"Cooler",   temp:"34°F to 38°F",  aisles:["A","B"],         bays:8, levels:3},
  DRY:{name:"Dry",      temp:"ambient",       aisles:["A","B","C"],     bays:8, levels:3},
};

function buildLocations(){
  const L = [];
  const add = (id,type,zone,extra={}) =>
    L.push(Object.assign({id,type,zone,capacity:2,active:true},extra));
  for (const [z,cfg] of Object.entries(ZONES))
    for (const a of cfg.aisles)
      for (let b=1;b<=cfg.bays;b++)
        for (let l=1;l<=cfg.levels;l++)
          add(`${z}-${a}-${String(b).padStart(2,"0")}-${l}`,"SLOT",z,
              {aisle:a,bay:b,level:l,pickable:l===1});
  ["FRZ-DOCK-01","FRZ-DOCK-02"].forEach(id=>add(id,"DOCK","FRZ",{capacity:30}));
  add("CLR-DOCK-01","DOCK","CLR",{capacity:30});
  add("DRY-DOCK-01","DOCK","DRY",{capacity:30});
  ["A","B","C","D","E","F"].forEach(x=>add("STG-LANE-"+x,"STAGING",null,{capacity:26}));
  for(let i=1;i<=8;i++) add("YARD-"+String(i).padStart(2,"0"),"YARD",null,{capacity:1});
  ["TRUCK-255","TRUCK-261","TRUCK-274"].forEach(id=>add(id,"TRUCK",null,{capacity:26}));
  CUSTOMERS.forEach(c=>add(c.id,"CUSTOMER",null,{capacity:999,name:c.name}));
  // a couple of realistically broken slots
  L.find(x=>x.id==="FRZ-C-05-3").active = false;
  L.find(x=>x.id==="FRZ-C-05-3").note   = "Rack beam damaged — blocked 2026-07-30";
  L.find(x=>x.id==="DRY-B-02-2").active = false;
  L.find(x=>x.id==="DRY-B-02-2").note   = "Sprinkler clearance violation";
  return L;
}

const USERS = ["jsantos","akim","rlopez","dpatel","mreyes","tnguyen"];

function seed(){
  const r = rng(20260818);
  const pick = a => a[Math.floor(r()*a.length)];
  const int  = (lo,hi) => lo + Math.floor(r()*(hi-lo+1));
  const now  = Date.now(), H = 3600e3, D = 24*H;
  const iso  = ms => new Date(ms).toISOString();

  const locations = buildLocations();
  const slots = locations.filter(l=>l.type==="SLOT" && l.active);
  const lots = [], pallets = [], events = [], trailers = [], orders = [], loads = [];
  let lotN = 400, lpnN = 100400, evN = 0, caseN = 0;
  const cases = [];

  const ev = o => { events.push(Object.assign({id:"E"+(++evN)},o)); return events[events.length-1]; };

  /* ── inbound trailers ────────────────────────────────────────────────── */
  const trailerPlan = [
    {id:"TRL-4468", carrier:"Midland Freight Lines",   ago:2.05*D, door:"DRY-DOCK-01", zone:"DRY", pallets:22, expected:23, done:true},
    {id:"TRL-4470", carrier:"Northstar Dairy Supply",  ago:1.30*D, door:"CLR-DOCK-01", zone:"CLR", pallets:19, expected:19, done:true},
    {id:"TRL-4471", carrier:"Coastline Refrigerated",  ago:0.55*D, door:"FRZ-DOCK-01", zone:"FRZ", pallets:24, expected:24, done:true},
    {id:"TRL-4472", carrier:"Coastline Refrigerated",  ago:0.18*D, door:"FRZ-DOCK-02", zone:"FRZ", pallets:16, expected:21, done:false},
    {id:"TRL-4475", carrier:"Valley Fresh Produce",    ago:0.05*D, door:null,          zone:"CLR", pallets:0,  expected:20, done:false, yard:"YARD-03"},
  ];

  // slot occupancy tracked as we go, so putaway lands somewhere legal
  const occ = new Map();
  const freeSlot = (zone, from) => {
    const z = slots.filter(s=>s.zone===zone);
    for (let i=0;i<z.length;i++){
      const s = z[(from+i) % z.length];
      if ((occ.get(s.id)||0) < s.capacity){ occ.set(s.id,(occ.get(s.id)||0)+1); return s; }
    }
    return z[0];
  };

  for (const t of trailerPlan){
    const arrived = now - t.ago;
    const zoneItems = ITEMS.filter(i=>i.zone===t.zone);
    const receiver = pick(USERS);
    const trailer = {
      id:t.id, carrier:t.carrier, unit:"CRLU-"+int(700000,799999), seal:"SL-"+int(90000,99999),
      sealIntact: t.id!=="TRL-4472", driver:pick(["S. Whitfield","M. Okafor","R. Duarte","L. Chen"]),
      po:["PO-"+int(88000,88999)], appt:iso(arrived - int(-20,25)*60e3), arrived:iso(arrived),
      door:t.door, yard:t.yard||null, zone:t.zone,
      unloadStart: t.pallets ? iso(arrived+15*60e3) : null,
      unloadEnd:   t.done    ? iso(arrived+95*60e3) : null,
      departed:    t.done    ? iso(arrived+112*60e3): null,
      tempOnOpen:  t.zone==="FRZ" ? -8 + int(-3,4) : t.zone==="CLR" ? 34 + int(0,5) : null,
      expectedPallets: t.expected, receiver,
      status: t.done ? "Unloaded" : t.pallets ? "Unloading" : "In yard",
    };
    trailers.push(trailer);

    ev({ts:iso(arrived), type:"ARRIVED", entity:t.id, from:"GATE",
        to:t.door||t.yard, user:receiver, ref:"BOL-"+int(50000,59999),
        note:`${t.carrier} · seal ${trailer.seal}`});

    // one lot per SKU on this trailer, then pallets under it
    const lotsHere = new Map();
    for (let p=0;p<t.pallets;p++){
      const item = zoneItems[p % zoneItems.length];
      let lot = lotsHere.get(item.sku);
      if (!lot){
        const vendor = pick(VENDORS);
        // age at receipt has to be plausible for the shelf life — nobody takes
        // in 50-day-old romaine
        const packDate = arrived - int(2, Math.max(3, Math.min(24, item.shelfLifeMo*8)))*D;
        lot = {
          id:"LOT-"+new Date(arrived).getFullYear()+"-"+String(new Date(arrived).getMonth()+1).padStart(2,"0")+"-"+(++lotN),
          tlc:(item.zone==="FRZ"?"VN":"US")+int(10,99)+int(100,399)+"-"+pick(["A1","A3","B2","C7"]),
          sku:item.sku, vendor:vendor.id, po:trailer.po[0],
          packDate:iso(packDate), bestBy:iso(packDate + item.shelfLifeMo*30*D),
          origin:vendor.origin, trailer:t.id, receivedAt:iso(arrived+20*60e3),
          receivingTemp:trailer.tempOnOpen,
        };
        lots.push(lot); lotsHere.set(item.sku, lot);
      }
      const qty = item.perPallet - (r()<0.15 ? int(1,9) : 0); // partial pallets happen
      const lpn = "LPN-"+(++lpnN);
      pallets.push({lpn, kind:"inbound", source:t.id, built:iso(arrived+(18+p*4)*60e3)});
      const recvTs = arrived + (18 + p*4)*60e3;
      ev({ts:iso(recvTs), type:"RECEIVED", entity:lpn, lot:lot.id, sku:item.sku,
          cases:qty, from:t.id, to:t.door||t.yard, user:receiver, ref:lot.po});

      // catch-weight SKUs get serialized cases — everything else stays at lot grain
      if (item.catchWeight && cases.length < 240){
        for (let c=0;c<qty;c++)
          cases.push({id:"CS-"+String(++caseN).padStart(6,"0"), lpn, lot:lot.id, sku:item.sku,
                      weight:+(item.netWt + (r()*4-2)).toFixed(1)});
      }

      // putaway — but not all of them, on purpose (see Exceptions)
      const strand = !t.done && p>=t.pallets-4;      // still being worked
      const forgotten = t.id==="TRL-4471" && p===7;   // the one that got lost
      if (!strand && !forgotten){
        const slot = freeSlot(item.zone, p*7 + t.pallets*3);
        ev({ts:iso(recvTs + int(20,180)*60e3), type:"PUTAWAY", entity:lpn, lot:lot.id, sku:item.sku,
            cases:0, from:t.door, to:slot.id, user:pick(USERS)});
      }
    }
    if (t.done)
      ev({ts:trailer.departed, type:"DEPARTED", entity:t.id, from:t.door, to:"GATE",
          user:receiver, ref:"BOL-"+int(50000,59999), note:"Signed BOL returned to driver"});
  }

  /* ── exceptions worth demoing ─────────────────────────────────────────── */
  const inStock = () => pallets.filter(p=>{
    const l = lastMove(events,p.lpn); return l && locations.find(x=>x.id===l.to)?.type==="SLOT";
  });
  const dmg = inStock()[3];
  if (dmg){
    const e = firstRecv(events,dmg.lpn);
    ev({ts:iso(now-9*H), type:"DAMAGED", entity:dmg.lpn, lot:e.lot, sku:e.sku, cases:-3,
        from:lastMove(events,dmg.lpn).to, to:lastMove(events,dmg.lpn).to, user:"akim",
        ref:"DMG-1188", note:"Forklift puncture — 3 cases unsellable"});
  }
  const held = inStock()[11];
  if (held){
    const e = firstRecv(events,held.lpn);
    ev({ts:iso(now-30*H), type:"HOLD_PLACED", entity:held.lpn, lot:e.lot, sku:e.sku, cases:0,
        from:lastMove(events,held.lpn).to, to:lastMove(events,held.lpn).to, user:"dpatel",
        ref:"QA-0442", note:"QA hold — temp excursion on inbound trailer, awaiting disposition"});
  }
  const counted = inStock()[19];
  if (counted){
    const e = firstRecv(events,counted.lpn);
    ev({ts:iso(now-5*H), type:"COUNTED", entity:counted.lpn, lot:e.lot, sku:e.sku, cases:-2,
        from:lastMove(events,counted.lpn).to, to:lastMove(events,counted.lpn).to, user:"tnguyen",
        ref:"CC-08-B", note:"Cycle count variance −2 cases"});
  }
  // somebody triple-stacked a two-deep slot, and put a pallet in a blocked one
  const crowd = inStock().slice(24,27);
  if (crowd.length===3){
    const target = lastMove(events,crowd[0].lpn).to;
    for (const p of crowd.slice(1)){
      const e = firstRecv(events,p.lpn);
      ev({ts:iso(now-7*H), type:"MOVED", entity:p.lpn, lot:e.lot, sku:e.sku, cases:0,
          from:lastMove(events,p.lpn).to, to:target, user:"rlopez", note:"No room in the home slot"});
    }
  }
  // one lot that quietly went past date on the rack — the thing FEFO is for
  const stale = lots.filter(l=>{
    const i = ITEMS.find(x=>x.sku===l.sku);
    return i && i.shelfLifeMo <= 6;
  })[1];
  if (stale) stale.bestBy = iso(now - 2*D);

  const blocked = inStock()[31];
  if (blocked){
    const e = firstRecv(events,blocked.lpn);
    ev({ts:iso(now-11*H), type:"MOVED", entity:blocked.lpn, lot:e.lot, sku:e.sku, cases:0,
        from:lastMove(events,blocked.lpn).to, to:"DRY-B-02-2", user:"dpatel",
        note:"Parked in a blocked slot"});
  }

  /* ── outbound: orders, picks, staging, load, delivery ─────────────────── */
  const orderPlan = [
    {so:"SO-40912", cust:"CUST-2501", route:"RT-B", truck:"TRUCK-255", lane:"STG-LANE-B", ago:0.9*D, state:"delivered"},
    {so:"SO-40918", cust:"CUST-2588", route:"RT-B", truck:"TRUCK-255", lane:"STG-LANE-B", ago:0.9*D, state:"delivered"},
    {so:"SO-40931", cust:"CUST-2601", route:"RT-A", truck:"TRUCK-261", lane:"STG-LANE-A", ago:0.25*D, state:"staged"},
    {so:"SO-40940", cust:"CUST-2640", route:"RT-A", truck:"TRUCK-261", lane:"STG-LANE-A", ago:0.10*D, state:"picking"},
  ];
  for (const o of orderPlan){
    const cust = CUSTOMERS.find(c=>c.id===o.cust);
    const picker = pick(USERS);
    const t0 = now - o.ago;
    const outLpn = "LPN-2"+String(++lpnN).slice(1);
    pallets.push({lpn:outLpn, kind:"outbound", order:o.so, customer:o.cust, built:iso(t0)});
    orders.push({id:o.so, customer:o.cust, customerName:cust.name, route:o.route,
                 released:iso(t0-2*H), pallet:outLpn, status:o.state});

    // pull 3–5 source pallets that are actually in stock
    const src = inStock().filter(p=>p.kind==="inbound").slice(0);
    for (let k=0;k<int(3,5);k++){
      const s = src[(k*13+7) % src.length];
      if (!s) continue;
      const e = firstRecv(events,s.lpn);
      const onHand = palletCases(events,s.lpn);
      const take = Math.min(int(4,14), Math.max(0,onHand-6));
      if (take<=0) continue;
      const ts = iso(t0 + k*11*60e3);
      const from = lastMove(events,s.lpn).to;
      ev({ts, type:"PICKED", entity:s.lpn,  lot:e.lot, sku:e.sku, cases:-take,
          from, to:outLpn, user:picker, ref:o.so});
      ev({ts, type:"PICKED", entity:outLpn, lot:e.lot, sku:e.sku, cases:+take,
          from, to:outLpn, user:picker, ref:o.so});
    }
    if (o.state==="picking") continue;

    ev({ts:iso(t0+70*60e3), type:"STAGED", entity:outLpn, cases:0,
        from:"PICK FLOOR", to:o.lane, user:picker, ref:o.so});
    if (o.state==="staged") continue;

    const loadId = "LOAD-"+o.route+"-"+String(loads.length+1).padStart(2,"0");
    if (!loads.find(l=>l.truck===o.truck && l.route===o.route)){
      loads.push({id:loadId, truck:o.truck, route:o.route, driver:"mreyes",
                  departed:iso(t0+3.2*H), stops:[o.cust], setpoint:-10});
    } else {
      loads.find(l=>l.truck===o.truck && l.route===o.route).stops.push(o.cust);
    }
    const load = loads.find(l=>l.truck===o.truck && l.route===o.route);
    ev({ts:iso(t0+2.9*H), type:"LOADED", entity:outLpn, cases:0,
        from:o.lane, to:o.truck, user:pick(USERS), ref:"BOL-773"+String(loads.length).padStart(2,"0")});
    ev({ts:load.departed, type:"DEPARTED", entity:load.id, from:o.truck, to:"ROUTE "+o.route,
        user:load.driver, ref:"BOL-773"+String(loads.length).padStart(2,"0")});

    // deliver everything on that pallet
    const onPallet = contentsOf(events,outLpn);
    for (const line of onPallet)
      ev({ts:iso(t0+6.4*H), type:"DELIVERED", entity:outLpn, lot:line.lot, sku:line.sku,
          cases:-line.cases, from:o.truck, to:o.cust, user:load.driver, ref:"POD-773"+String(loads.length).padStart(2,"0")});
  }

  events.sort((a,b)=> a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
  return {items:ITEMS, vendors:VENDORS, customers:CUSTOMERS, locations, lots,
          pallets, cases, trailers, orders, loads, events, seq:{lpn:lpnN, lot:lotN, ev:evN}};
}

/* ══════════════════════════════════════════════════════════════════════════
   DERIVE — nothing below is ever stored

   These take an explicit event array so the seed generator can use them
   before DB exists. At runtime everything goes through the D() cache.
   ══════════════════════════════════════════════════════════════════════════ */
const evFor   = (evs,id) => evs.filter(e=>e.entity===id);
const mvOf    = evs => { for (let i=evs.length-1;i>=0;i--) if (ET[evs[i].type]?.moves && evs[i].to) return evs[i]; };
const sumCases= evs => evs.reduce((s,e)=>s+(e.cases||0),0);
const lastMove= (evs,id) => mvOf(evFor(evs,id));
const firstRecv=(evs,id) => { const a = evFor(evs,id); return a.find(e=>e.type==="RECEIVED") || a[0] || {}; };
const palletCases=(evs,id)=> sumCases(evFor(evs,id));

// contents of a pallet = its own events grouped by lot. Deliberately has no
// dependency on DB, so the seed generator can call it mid-build.
function linesOf(evs){
  const m = new Map();
  for (const e of evs){
    if (!e.lot || !e.cases) continue;
    const cur = m.get(e.lot) || {cases:0, sku:e.sku};
    cur.cases += e.cases;
    if (e.sku) cur.sku = e.sku;
    m.set(e.lot, cur);
  }
  return [...m].filter(([,v])=>v.cases>0).map(([lot,v])=>({lot, cases:v.cases, sku:v.sku}));
}
const contentsOf = (evs,lpn) => linesOf(evFor(evs,lpn));

const lotOf  = id => DB.lots.find(l=>l.id===id);
const itemOf = sku=> DB.items.find(i=>i.sku===sku);
const locOf  = id => DB.locations.find(l=>l.id===id);

/* Derived-state cache. Rebuilt from scratch whenever an event is appended —
   never patched, so it cannot drift from the ledger. */
let _c = null;
const bust = () => { _c = null; };
function D(){
  if (_c) return _c;
  _c = {byEntity:new Map(), byLot:new Map()};
  for (const e of DB.events){
    if (!_c.byEntity.has(e.entity)) _c.byEntity.set(e.entity, []);
    _c.byEntity.get(e.entity).push(e);
    if (e.lot){
      if (!_c.byLot.has(e.lot)) _c.byLot.set(e.lot, []);
      _c.byLot.get(e.lot).push(e);
    }
  }
  // palletState() below reads _c.byEntity, which is already populated
  _c.states = DB.pallets.map(p=>Object.assign(palletState(p.lpn), p));
  _c.live   = _c.states.filter(s=>s.cases>0);
  _c.byLoc  = new Map();
  for (const s of _c.live){
    if (!_c.byLoc.has(s.loc)) _c.byLoc.set(s.loc, []);
    _c.byLoc.get(s.loc).push(s);
  }
  return _c;
}

function palletState(lpn){
  const evs  = D().byEntity.get(lpn) || [];
  const mv   = mvOf(evs);
  const loc  = mv ? mv.to : null;
  const lt   = loc ? locOf(loc) : null;
  const cases= sumCases(evs);
  const held = evs.filter(e=>e.type==="HOLD_PLACED"||e.type==="HOLD_RELEASED").pop()?.type==="HOLD_PLACED";
  const putaway = evs.some(e=>e.type==="PUTAWAY");
  let status="Unknown", cls="";
  if (cases<=0)                       {status="Shipped out"; cls="";}
  else if (held)                      {status="ON HOLD";     cls="bad";}
  else if (lt?.type==="SLOT")         {status="In stock";    cls="good";}
  else if (lt?.type==="DOCK")         {status=putaway?"At dock":"Awaiting putaway"; cls="warn";}
  else if (lt?.type==="STAGING")      {status="Staged";      cls="info";}
  else if (lt?.type==="TRUCK")        {status="On truck";    cls="info";}
  else if (lt?.type==="CUSTOMER")     {status="Delivered";   cls="";}
  else if (lt?.type==="YARD")         {status="In yard";     cls="warn";}
  const last = evs[evs.length-1];
  return {lpn, loc, locType:lt?.type, cases, held, putaway, status, cls,
          lines:linesOf(evs), last, evs};
}

const allPalletStates = () => D().states;
const liveStates      = () => D().live;
const locationContents= id => D().byLoc.get(id) || [];

function lotState(lotId){
  const evs = D().byLot.get(lotId) || [];
  const onHand = evs.reduce((s,e)=>s+(e.cases||0),0);
  const received = evs.filter(e=>e.type==="RECEIVED").reduce((s,e)=>s+e.cases,0);
  const holders = liveStates().filter(s=>s.lines.some(l=>l.lot===lotId));
  return {onHand, received, holders, evs};
}

function itemState(sku){
  const lots = DB.lots.filter(l=>l.sku===sku).map(l=>Object.assign({}, l, lotState(l.id)));
  const onHand = lots.reduce((s,l)=>s+l.onHand,0);
  const live = lots.filter(l=>l.onHand>0);
  const oldest = live.map(l=>l.bestBy).sort()[0];
  const pallets = new Set(); live.forEach(l=>l.holders.forEach(h=>pallets.add(h.lpn)));
  return {lots, live, onHand, oldest, pallets:[...pallets]};
}

function exceptions(){
  const now = Date.now(), D=864e5;
  const live = liveStates();
  return {
    stranded: live.filter(s=>s.locType==="DOCK" && !s.putaway),
    held:     live.filter(s=>s.held),
    yard:     DB.trailers.filter(t=>t.status==="In yard"),
    damaged:  DB.events.filter(e=>e.type==="DAMAGED"||e.type==="DISPOSED"),
    variance: DB.events.filter(e=>(e.type==="COUNTED"||e.type==="ADJUSTED") && e.cases),
    expiring: DB.lots.map(l=>Object.assign({},l,lotState(l.id)))
                     .filter(l=>l.onHand>0 && new Date(l.bestBy) - now < 45*D)
                     .sort((a,b)=>a.bestBy<b.bestBy?-1:1),
    overcap:  DB.locations.filter(l=>l.type==="SLOT")
                .map(l=>({loc:l,n:locationContents(l.id).length}))
                .filter(x=>x.n>x.loc.capacity || (x.n>0 && !x.loc.active)),
    tempFail: DB.trailers.filter(t=>(t.zone==="FRZ" && t.tempOnOpen>0) ||
                                    (t.zone==="CLR" && t.tempOnOpen>40) || t.sealIntact===false),
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   STORE
   ══════════════════════════════════════════════════════════════════════════ */
let DB;
function load(){
  bust();
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ DB = JSON.parse(raw); return; } }catch(e){}
  DB = seed(); save();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }
function commit(e){
  DB.events.push(Object.assign({id:"E"+(++DB.seq.ev), ts:new Date().toISOString()}, e));
  DB.events.sort((a,b)=> a.ts<b.ts?-1:a.ts>b.ts?1:0);
  bust();   // derived state is rebuilt, never patched
  save();
}

/* ══════════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════════ */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el  = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
function fmt(ts){
  const d = new Date(ts), n = new Date();
  const time = d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  const same = d.toDateString()===n.toDateString();
  return same ? "Today "+time : d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+time;
}
const day = ts => new Date(ts).toLocaleDateString([], {year:"numeric",month:"short",day:"numeric"});
const ago = ts => { const h=(Date.now()-new Date(ts))/36e5;
  return h<1 ? Math.round(h*60)+"m" : h<48 ? Math.round(h)+"h" : Math.round(h/24)+"d"; };
const idl = (id,label) => id ? `<a class="id" data-id="${esc(id)}">${esc(label||id)}</a>` : `<span class="mut">—</span>`;
const zoneTag = z => z ? `<span class="tag zone-${z}">${z}</span>` : "";

/* ══════════════════════════════════════════════════════════════════════════
   UNIVERSAL SEARCH  — one index over every record type
   ══════════════════════════════════════════════════════════════════════════ */
function index(){
  const out = [];
  const push = (type,id,title,desc,right,kind) => out.push({type,id,title,desc,right,kind});

  for (const p of allPalletStates()){
    const lines = p.lines.map(l=>l.sku).join(" ");
    push("pallet",p.lpn,p.lpn,
      (p.lines[0] ? itemOf(p.lines[0].sku)?.desc : p.kind==="outbound" ? "Order pallet "+(p.order||"") : "Empty pallet"),
      p.cases>0 ? `${p.cases} cs · ${p.loc||"—"}` : "shipped",
      lines+" "+(p.lines.map(l=>l.lot).join(" "))+" "+(p.source||"")+" "+(p.order||"")+" "+(p.customer||"")+" "+p.status);
  }
  for (const c of DB.cases)
    push("case",c.id,c.id, itemOf(c.sku)?.desc, `${c.weight} lb · on ${c.lpn}`, c.lpn+" "+c.lot+" "+c.sku);
  for (const i of DB.items){
    const st = itemState(i.sku);
    push("item",i.sku,i.sku,i.desc,`${st.onHand} cs on hand`, i.brand+" "+i.category+" "+i.pack+" "+i.zone);
  }
  for (const l of DB.lots){
    const st = lotState(l.id);
    push("lot",l.id,l.id, itemOf(l.sku)?.desc, `${st.onHand} cs · best by ${day(l.bestBy)}`,
         l.tlc+" "+l.sku+" "+l.vendor+" "+l.po+" "+l.origin+" "+l.trailer);
  }
  for (const l of DB.locations){
    if (l.type === "CUSTOMER") continue;   // the customer record already covers it
    const n = locationContents(l.id);
    push("location",l.id,l.id, l.name || (ZONES[l.zone]?.name || l.type),
         n.length ? `${n.length} pallet${n.length>1?"s":""} · ${n.reduce((s,x)=>s+x.cases,0)} cs` : "empty",
         l.type+" "+(l.zone||"")+" "+(l.note||""));
  }
  for (const t of DB.trailers)
    push("trailer",t.id,t.id, t.carrier, t.status, t.unit+" "+t.seal+" "+t.driver+" "+t.po.join(" ")+" "+(t.door||t.yard||""));
  for (const o of DB.orders)
    push("order",o.id,o.id,o.customerName,o.status, o.customer+" "+o.route+" "+o.pallet);
  for (const c of DB.customers)
    push("customer",c.id,c.id,c.name,c.route,"");
  for (const v of DB.vendors)
    push("vendor",v.id,v.id,v.name,v.origin,"");
  for (const l of DB.loads)
    push("load",l.id,l.id,`${l.truck} · ${l.route}`,"departed "+fmt(l.departed), l.stops.join(" ")+" "+l.driver);
  return out;
}

// tie-breaker: when two records match equally well, the canonical one wins.
// Searching "shrimp" should land on the SKU, not on the first of its 12 lots.
const TYPEW = {item:9, location:8, lot:7, trailer:7, order:6, customer:6,
               vendor:6, load:5, pallet:4, case:3};

function search(qs){
  const q = qs.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const scored = [];
  for (const r of index()){
    const hay = (r.id+" "+r.title+" "+(r.desc||"")+" "+(r.kind||"")).toLowerCase();
    if (!terms.every(t=>hay.includes(t))) continue;
    const rid = r.id.toLowerCase();
    let s;
    if (rid === q) s = 1000;                                  // a full scan
    else if (rid.startsWith(q)) s = 500;
    else if (rid.includes(q)) s = 300;
    else if ((r.title||"").toLowerCase().includes(q)) s = 200;
    else if ((r.desc||"").toLowerCase().includes(q)) s = 100;
    else s = 50;
    scored.push([s*10 + (TYPEW[r.type]||0), r]);
  }
  return scored.sort((a,b)=> b[0]-a[0] || a[1].id.localeCompare(b[1].id)).slice(0,60).map(x=>x[1]);
}

VIEWS.map = () => {
  const live = liveStates();
  const byLoc = new Map();
  live.forEach(p=>{ if(!byLoc.has(p.loc)) byLoc.set(p.loc,[]); byLoc.get(p.loc).push(p); });

  const zoneHtml = (z,cfg) => {
    const rows = cfg.aisles.map(a=>{
      const bays = [];
      for (let b=1;b<=cfg.bays;b++){
        const cells = [];
        for (let l=1;l<=cfg.levels;l++){
          const id = `${z}-${a}-${String(b).padStart(2,"0")}-${l}`;
          const loc = locOf(id), n = (byLoc.get(id)||[]).length;
          let cls = "slot";
          if (!loc.active) cls += " blocked";
          else if (n > loc.capacity) cls += " over";
          else if (n >= loc.capacity) cls += " p2";
          else if (n > 0) cls += " p1";
          cells.push(`<div class="${cls}" data-id="${id}" title="${id} — ${n} pallet(s)"></div>`);
        }
        bays.push(`<div class="bay">${cells.join("")}<div class="bn">${String(b).padStart(2,"0")}</div></div>`);
      }
      return `<div class="aisle"><div class="nm">${z}-${a}</div><div class="bays">${bays.join("")}</div></div>`;
    }).join("");
    const total = DB.locations.filter(l=>l.type==="SLOT"&&l.zone===z&&l.active).length;
    const used  = [...byLoc.keys()].filter(k=>locOf(k)?.type==="SLOT"&&locOf(k)?.zone===z).length;
    return `<div class="card" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:12px">
        <strong>${cfg.name}</strong>${zoneTag(z)}
        <span class="mut" style="font-size:12px">${cfg.temp}</span>
        <span class="spacer" style="flex:1"></span>
        <span class="mut" style="font-size:12px">${used}/${total} slots</span></div>
      ${rows}</div>`;
  };

  const other = t => {
    const ls = DB.locations.filter(l=>l.type===t);
    return `<div class="card" style="margin-bottom:12px"><strong style="text-transform:capitalize">${t.toLowerCase()}</strong>
      <div class="tw" style="border:none;margin-top:9px"><table><tbody>${ls.map(l=>{
        const n = byLoc.get(l.id)||[];
        return `<tr class="click" data-id="${l.id}"><td>${idl(l.id)}</td>
          <td class="mut">${esc(l.name||"")}</td>
          <td class="num">${n.length?`${n.length} plt · ${n.reduce((s,x)=>s+x.cases,0)} cs`:'<span class="mut">empty</span>'}</td></tr>`;
      }).join("")}</tbody></table></div></div>`;
  };

  return `<h1>Warehouse map</h1>
    <p class="sub">Every rack position, dock, staging lane, yard spot and truck is a location. Click any cell.</p>
    <div class="legend">
      <span><i></i>empty</span><span><i style="background:var(--accent-bg);border-color:var(--accent)"></i>partial</span>
      <span><i style="background:var(--accent);border-color:var(--accent)"></i>full</span>

      <span class="mut">· bottom row = level 1 (pick face)</span>
    </div>
    ${Object.entries(ZONES).map(([z,c])=>zoneHtml(z,c)).join("")}
    ${other("DOCK")}${other("STAGING")}${other("YARD")}${other("TRUCK")}`;

    const s = palletState(id), p = DB.pallets.find(x=>x.lpn===id);
    const cs = DB.cases.filter(c=>c.lpn===id);
    return {title:id, tag:`<span class="tag ${s.cls}">${s.status}</span>`, sub:p.kind==="outbound"?"Order pallet":"Received pallet",
      body: kv([
        ["Current location", s.loc?idl(s.loc):"—"],
        ["Cases on pallet", `<strong>${s.cases}</strong>`],
        p.source && ["Came off", idl(p.source)],
        p.order && ["Sales order", idl(p.order)],
        p.customer && ["Customer", idl(p.customer)],
        ["Built", fmt(p.built), 1],
        ["Last touched", `${s.last?fmt(s.last.ts)+" · "+esc(s.last.user||""):"—"}`, 1],
      ]) +
      `<h2>Contents</h2><div class="tw"><table><thead><tr><th>SKU</th><th>Lot</th><th>Best by</th><th class="num">Cases</th></tr></thead>
       <tbody>${s.lines.map(l=>{const lo=lotOf(l.lot);return `<tr><td>${idl(l.sku)}</td><td>${idl(l.lot)}</td>
         <td class="mut">${lo?day(lo.bestBy):"—"}</td><td class="num">${l.cases}</td></tr>`;}).join("")
         || `<tr><td colspan="4" class="empty">Empty — all cases shipped.</td></tr>`}</tbody></table></div>` +
      (cs.length?`<h2>Serialized cases <span class="tag warn">catch weight</span></h2>
        <div class="tw" style="max-height:190px;overflow:auto"><table><tbody>${cs.slice(0,40).map(c=>
        `<tr class="click" data-id="${c.id}"><td>${idl(c.id)}</td><td class="num">${c.weight} lb</td></tr>`).join("")}
        </tbody></table></div>${cs.length>40?`<div class="hint">+${cs.length-40} more</div>`:""}`:"") +
      `<h2>History</h2>${timeline(s.evs)}`};
  },
  case(id){
    const c = DB.cases.find(x=>x.id===id), s = palletState(c.lpn);
    return {title:id, tag:`<span class="tag ${s.cls}">${s.status}</span>`, sub:itemOf(c.sku)?.desc,
      body: kv([["On pallet", idl(c.lpn)],["Current location", s.loc?idl(s.loc):"—"],
                ["Lot", idl(c.lot)],["SKU", idl(c.sku)],["Actual weight", c.weight+" lb"]]) +
        `<p class="hint">This case is serialized because its SKU is catch-weight — each case has its own billable weight. Non-catch-weight SKUs are tracked at lot grain inside the pallet (see §4.3).</p>
         <h2>Pallet history</h2>${timeline(s.evs)}`};
  },
  item(id){
    const i = itemOf(id), st = itemState(id);
    return {title:id, tag:zoneTag(i.zone), sub:i.desc,
      body: kv([["Brand", esc(i.brand),1],["Category", esc(i.category),1],["Pack", i.pack],
        ["Net weight", i.netWt+" lb"],["Cases per pallet", i.perPallet],["Shelf life", i.shelfLifeMo+" months",1],
        ["Catch weight", i.catchWeight?'<span class="tag warn">YES — per-case weight</span>':"No"],
        ["FDA traceability list", i.ftl?'<span class="tag info">on FTL — verify</span>':"Not listed"],
        ["On hand", `<strong>${st.onHand} cases</strong>`]]) +
      `<h2>Lots on hand</h2><div class="tw"><table>
        <thead><tr><th>Lot</th><th>Best by</th><th class="num">Cases</th><th class="num">Pallets</th></tr></thead>
        <tbody>${st.live.sort((a,b)=>a.bestBy<b.bestBy?-1:1).map(l=>`<tr class="click" data-id="${l.id}">
          <td>${idl(l.id)}</td><td class="mut">${day(l.bestBy)}</td>
          <td class="num">${l.onHand}</td><td class="num">${l.holders.length}</td></tr>`).join("")
          || `<tr><td colspan="4" class="empty">No stock on hand.</td></tr>`}</tbody></table></div>
       <p class="hint">Sorted first-expired-first, which is the pick order FEFO requires.</p>`};
  },
  lot(id){
    const l = lotOf(id), st = lotState(id), i = itemOf(l.sku);
    return {title:id, tag:`<span class="tag ${st.onHand?"good":""}">${st.onHand} cs on hand</span>`, sub:i?.desc,
      body: kv([
        ["Traceability lot code", `<strong>${esc(l.tlc)}</strong>`],
        ["SKU", idl(l.sku)],["Vendor", idl(l.vendor)],["PO", esc(l.po)],
        ["Arrived on", idl(l.trailer)],["Country of origin", esc(l.origin),1],
        ["Pack date", day(l.packDate),1],["Best by", day(l.bestBy),1],
        ["Received", `${st.received} cases`],["On hand", `<strong>${st.onHand} cases</strong>`],
        l.receivingTemp!=null && ["Receiving temp", l.receivingTemp+"°F"],
      ]) +
      `<h2>Recall drill — where is it now</h2>
       <div class="tw"><table><thead><tr><th>Pallet</th><th>Location</th><th class="num">Cases</th><th>Status</th></tr></thead>
       <tbody>${st.holders.map(h=>`<tr class="click" data-id="${h.lpn}"><td>${idl(h.lpn)}</td>
         <td>${h.loc?idl(h.loc):"—"}</td><td class="num">${h.lines.find(x=>x.lot===id)?.cases||0}</td>
         <td><span class="tag ${h.cls}">${h.status}</span></td></tr>`).join("")
         || `<tr><td colspan="4" class="empty">Nothing on hand from this lot.</td></tr>`}</tbody></table></div>
       <p class="hint">Plus everything already shipped, below — which is the half a recall actually needs.</p>
       <h2>Full lot history</h2>${timeline(st.evs)}`};
  },
  location(id){
    const l = locOf(id), n = locationContents(id);
    return {title:id, tag:`<span class="tag ${l.active===false?"bad":"good"}">${l.active===false?"BLOCKED":l.type}</span>`,
      sub: l.name || (ZONES[l.zone]? ZONES[l.zone].name+" · "+ZONES[l.zone].temp : l.type),
      body: kv([["Type", l.type],["Zone", l.zone||"—"],["Capacity", l.capacity+" pallets"],
        ["Occupied", `${n.length} pallet${n.length===1?"":"s"}${n.length>l.capacity?' <span class="tag bad">OVER</span>':""}`],
        ["Cases here", n.reduce((s,x)=>s+x.cases,0)],
        l.pickable!==undefined && ["Pick face", l.pickable?"Yes":"No (reserve)"],
        l.note && ["Note", `<span style="color:var(--warn)">${esc(l.note)}</span>`,1]]) +
      `<h2>What's here right now</h2>
       <div class="tw"><table><thead><tr><th>Pallet</th><th>Item</th><th class="num">Cases</th><th>Best by</th></tr></thead>
       <tbody>${n.map(p=>{const lo=lotOf(p.lines[0]?.lot);return `<tr class="click" data-id="${p.lpn}">
         <td>${idl(p.lpn)}</td><td style="font-size:12px">${esc(p.lines.map(x=>x.sku).join(", ")||"—")}</td>
         <td class="num">${p.cases}</td><td class="mut">${lo?day(lo.bestBy):"—"}</td></tr>`;}).join("")
         || `<tr><td colspan="4" class="empty">Empty.</td></tr>`}</tbody></table></div>
       <h2>Traffic through this location</h2>
       ${timeline(DB.events.filter(e=>e.to===id||e.from===id).slice(-25))}`};
  },
  trailer(id){
    const t = DB.trailers.find(x=>x.id===id);
    const ps = allPalletStates().filter(p=>p.source===id);
    const recv = ps.reduce((s,p)=>s+p.evs.filter(e=>e.type==="RECEIVED").reduce((a,e)=>a+e.cases,0),0);
    const bad = (t.zone==="FRZ"&&t.tempOnOpen>0)||(t.zone==="CLR"&&t.tempOnOpen>40);
    return {title:id, tag:`<span class="tag ${t.status==="Unloaded"?"good":t.status==="Unloading"?"info":"warn"}">${t.status}</span>`,
      sub:t.carrier,
      body: kv([
        ["Trailer / container", esc(t.unit)],["Seal", esc(t.seal)+(t.sealIntact?' <span class="tag good">intact</span>':' <span class="tag bad">BROKEN</span>')],
        ["Driver", esc(t.driver),1],["PO(s)", t.po.map(p=>esc(p)).join(", ")],
        ["Appointment", fmt(t.appt),1],["Arrived", fmt(t.arrived)+` (${ago(t.arrived)} ago)`,1],
        ["At", t.door?idl(t.door):t.yard?idl(t.yard):"—"],
        t.unloadStart && ["Unload start", fmt(t.unloadStart),1],
        t.unloadEnd && ["Unload end", fmt(t.unloadEnd),1],
        t.departed && ["Departed", fmt(t.departed),1],
        t.departed && ["Dwell time", Math.round((new Date(t.departed)-new Date(t.arrived))/6e4)+" min",1],
        t.tempOnOpen!=null && ["Temp on open", `<span class="tag ${bad?"bad":"good"}">${t.tempOnOpen}°F</span>`],
        ["Pallets expected / received", `${t.expectedPallets} / ${ps.length}` +
          (ps.length<t.expectedPallets && t.status==="Unloaded" ? ' <span class="tag bad">SHORT</span>':"")],
        ["Cases received", recv.toLocaleString()],
        ["Received by", esc(t.receiver)],
      ]) +
      `<h2>Everything that came off this trailer</h2>
       <p class="hint" style="margin-top:-4px">This is the "where did it all go" answer — one trailer, every pallet, current location.</p>
       <div class="tw"><table><thead><tr><th>Pallet</th><th>Item</th><th class="num">Cs</th><th>Now at</th></tr></thead>
       <tbody>${ps.map(p=>`<tr class="click" data-id="${p.lpn}"><td>${idl(p.lpn)}</td>
         <td style="font-size:12px">${esc(p.lines[0]?.sku||firstRecv(DB.events,p.lpn).sku||"—")}</td>
         <td class="num">${p.cases}</td>
         <td>${p.loc?idl(p.loc):'<span class="tag warn">nowhere</span>'} ${p.putaway?"":'<span class="tag warn">not put away</span>'}</td>
         </tr>`).join("") || `<tr><td colspan="4" class="empty">Not unloaded yet.</td></tr>`}</tbody></table></div>
       <h2>Trailer events</h2>${timeline(evFor(DB.events,id))}`};
  },
  order(id){
    const o = DB.orders.find(x=>x.id===id), s = palletState(o.pallet);
    return {title:id, tag:`<span class="tag ${s.cls}">${s.status}</span>`, sub:o.customerName,
      body: kv([["Customer", idl(o.customer)],["Route", esc(o.route)],["Released", fmt(o.released),1],
                ["Order pallet", idl(o.pallet)],["Cases", s.cases||"shipped"],["Now at", s.loc?idl(s.loc):"—"]]) +
        `<h2>Lines picked</h2><div class="tw"><table><thead><tr><th>SKU</th><th>Lot</th><th class="num">Cases</th></tr></thead>
         <tbody>${DB.events.filter(e=>e.ref===id&&e.type==="PICKED"&&e.cases>0).map(e=>
           `<tr><td>${idl(e.sku)}</td><td>${idl(e.lot)}</td><td class="num">${e.cases}</td></tr>`).join("")}
         </tbody></table></div><h2>History</h2>${timeline(s.evs)}`};
  },
  customer(id){
    const c = DB.customers.find(x=>x.id===id);
    const os = DB.orders.filter(o=>o.customer===id);
    return {title:id, tag:`<span class="tag info">${esc(c.route)}</span>`, sub:c.name,
      body: kv([["Route", esc(c.route),1],["Orders", os.length]]) +
        `<h2>Orders</h2><div class="tw"><table><tbody>${os.map(o=>
          `<tr class="click" data-id="${o.id}"><td>${idl(o.id)}</td><td class="mut">${esc(o.status)}</td>
           <td>${idl(o.pallet)}</td></tr>`).join("") || `<tr><td class="empty">None.</td></tr>`}</tbody></table></div>
         <h2>Deliveries</h2>${timeline(DB.events.filter(e=>e.to===id))}`};
  },
  vendor(id){
    const v = DB.vendors.find(x=>x.id===id);
    const ls = DB.lots.filter(l=>l.vendor===id).map(l=>Object.assign({},l,lotState(l.id)));
    return {title:id, tag:"", sub:v.name,
      body: kv([["Origin", esc(v.origin),1],["Lots supplied", ls.length],
                ["Cases on hand", ls.reduce((s,l)=>s+l.onHand,0)]]) +
        `<h2>Lots</h2><div class="tw"><table><thead><tr><th>Lot</th><th>SKU</th><th class="num">On hand</th><th>Best by</th></tr></thead>
         <tbody>${ls.map(l=>`<tr class="click" data-id="${l.id}"><td>${idl(l.id)}</td>
           <td style="font-size:12px">${esc(l.sku)}</td><td class="num">${l.onHand}</td>
           <td class="mut">${day(l.bestBy)}</td></tr>`).join("")}</tbody></table></div>`};
  },
  load(id){
    const l = DB.loads.find(x=>x.id===id);
    const ps = allPalletStates().filter(p=>p.evs.some(e=>e.type==="LOADED"&&e.to===l.truck));
    return {title:id, tag:`<span class="tag info">${esc(l.route)}</span>`, sub:l.truck+" · driver "+l.driver,
      body: kv([["Truck", idl(l.truck)],["Route", esc(l.route)],["Driver", esc(l.driver)],
                ["Setpoint", l.setpoint+"°F"],["Departed", fmt(l.departed),1],
                ["Stops", l.stops.map(s=>idl(s)).join(" ")]]) +
        `<h2>Pallets on this load</h2><div class="tw"><table><tbody>${ps.map(p=>
          `<tr class="click" data-id="${p.lpn}"><td>${idl(p.lpn)}</td>
           <td class="mut">${esc(p.order||"")}</td><td><span class="tag ${p.cls}">${p.status}</span></td></tr>`).join("")}
         </tbody></table></div>`};
  },
};

function openRec(id){
  const type = resolve(id);
  const d = document.getElementById("drawer");
  if (!type){ return false; }
  const rec = DETAIL[type](id);
  d.innerHTML = `<div class="dhead">
      <div><div class="row"><strong class="mono" style="font-size:15px">${esc(rec.title)}</strong>${rec.tag||""}</div>
        <div class="mut" style="font-size:12.5px;margin-top:2px">${esc(rec.sub||"")}</div></div>
      <button class="x" aria-label="Close">×</button></div>
    <div class="dbody">${rec.body}</div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
  d.scrollTop = 0;
  d.querySelector(".x").onclick = close;
  return true;
}
function close(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER + WIRING
   ══════════════════════════════════════════════════════════════════════════ */
const NAV = [
  ["Operations", [["dash","Today"],["receive","Receive"],["move","Put away / move"]]],
  ["Find",       [["search","Search"],["map","Warehouse map"],["inventory","Inventory"]]],
  ["Audit",      [["exceptions","Exceptions"],["ledger","Event ledger"]]],
];

function renderNav(){
  const ex = exceptions();
  const counts = {exceptions: ex.stranded.length+ex.held.length+ex.overcap.length+ex.tempFail.length,
                  ledger: DB.events.length};
  document.getElementById("nav").innerHTML = NAV.map(([grp,items])=>
    `<div class="grp">${grp}</div>` + items.map(([k,label])=>
      `<a data-view="${k}" class="${current===k?"on":""}">${label}${
        counts[k]!==undefined?`<span class="n">${counts[k]}</span>`:""}</a>`).join("")).join("");
}

function render(){
  document.getElementById("view").innerHTML = VIEWS[current]();
  renderNav();
  wire();
  window.scrollTo(0,0);
}
function go(v){ current = v; render(); }

/* One delegated listener for the whole app: anything carrying data-id opens
   that record, anything carrying data-view switches views. Works for markup
   rendered later — including inside the drawer and in flash messages. */
document.addEventListener("click", ev=>{
  const v = ev.target.closest("[data-view]");
  if (v){ go(v.dataset.view); return; }
  const n = ev.target.closest("[data-id]");
  if (n) openRec(n.dataset.id);
});

function wire(){
  const root = document.getElementById("view");
  const lf = root.querySelector("#lf");
  if (lf) lf.addEventListener("change", ()=>{ ledgerFilter = lf.value; render(); });

  /* receive */
  const rcv = root.querySelector("#rcv");
  if (rcv){
    const bb = rcv.bestBy;
    const setBB = () => { const i = itemOf(rcv.sku.value);
      const d = new Date(Date.now() + (i?.shelfLifeMo||12)*30*864e5);
      bb.value = d.toISOString().slice(0,10); };
    setBB(); rcv.sku.addEventListener("change", setBB);
    rcv.addEventListener("submit", e=>{
      e.preventDefault();
      const t = DB.trailers.find(x=>x.id===rcv.trailer.value);
      const item = itemOf(rcv.sku.value);
      const cases = parseInt(rcv.cases.value,10);
      const lpn = "LPN-"+(++DB.seq.lpn);
      const lot = {
        id:"LOT-"+new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0")+"-"+(++DB.seq.lot),
        tlc:rcv.tlc.value.trim().toUpperCase(), sku:item.sku,
        vendor:DB.vendors[0].id, po:t.po[0], packDate:new Date().toISOString(),
        bestBy:new Date(rcv.bestBy.value).toISOString(), origin:"—",
        trailer:t.id, receivedAt:new Date().toISOString(), receivingTemp:t.tempOnOpen,
      };
      const existing = DB.lots.find(l=>l.tlc===lot.tlc && l.sku===lot.sku);
      const useLot = existing || lot;
      if (!existing) DB.lots.push(lot);
      DB.pallets.push({lpn, kind:"inbound", source:t.id, built:new Date().toISOString()});
      commit({type:"RECEIVED", entity:lpn, lot:useLot.id, sku:item.sku, cases,
              from:t.id, to:t.door||t.yard, user:rcv.user.value, ref:useLot.po});
      root.querySelector("#rcv-out").innerHTML =
        `<div class="flash"><strong class="mono">${lpn}</strong> received — ${cases} cases of ${esc(item.sku)}
         at <span class="mono">${esc(t.door||t.yard)}</span>. Lot <span class="mono">${esc(useLot.id)}</span>${existing?" (existing)":" (new)"}.
         <br><a class="id" data-id="${lpn}">Open pallet →</a> · now put it away.</div>`;
      rcv.tlc.value=""; rcv.tlc.focus();
      renderNav();
    });
  }

  /* move */
  const mv = root.querySelector("#mv");
  if (mv){
    const info = root.querySelector("#mv-info");
    mv.lpn.addEventListener("input", ()=>{
      const v = mv.lpn.value.trim().toUpperCase();
      const p = DB.pallets.find(x=>x.lpn===v);
      if (!p){ info.innerHTML = v ? `<div class="hint" style="color:var(--bad);margin:-4px 0 11px">No pallet ${esc(v)}</div>` : ""; return; }
      const s = palletState(v);
      info.innerHTML = `<div class="card" style="background:var(--panel-2);margin:-4px 0 12px;padding:11px 13px">
        <div class="row"><span class="tag ${s.cls}">${s.status}</span>
          <strong>${s.cases} cases</strong><span class="mut">at ${esc(s.loc||"—")}</span></div>
        <div class="hint" style="margin-top:5px">${esc(s.lines.map(l=>`${l.sku} · ${l.cases} cs`).join(" / ")||"empty")}</div></div>`;
      mv.to.focus();
    });
    mv.addEventListener("submit", e=>{
      e.preventDefault();
      const lpn = mv.lpn.value.trim().toUpperCase();
      const to  = mv.to.value.trim().toUpperCase();
      const out = root.querySelector("#mv-out");
      const p = DB.pallets.find(x=>x.lpn===lpn);
      const dest = locOf(to);
      if (!p)    return out.innerHTML = `<div class="flash err">No pallet <span class="mono">${esc(lpn)}</span>.</div>`;
      if (!dest) return out.innerHTML = `<div class="flash err">No location <span class="mono">${esc(to)}</span>.</div>`;
      const s = palletState(lpn);
      if (dest.active === false)
        return out.innerHTML = `<div class="flash err"><span class="mono">${esc(to)}</span> is blocked — ${esc(dest.note||"")}. Pick another slot.</div>`;
      const item = itemOf(s.lines[0]?.sku);
      let warn = "";
      if (item && dest.zone && dest.zone !== item.zone)
        warn = `<br><strong>Temperature warning:</strong> ${item.sku} is a ${item.zone} item going into ${dest.zone}. Logged anyway — the ledger records what happened, not what should have.`;
      const n = locationContents(to).length;
      if (n >= dest.capacity) warn += `<br><strong>Over capacity:</strong> ${to} already holds ${n} of ${dest.capacity}.`;
      commit({type: s.putaway||s.locType!=="DOCK" ? "MOVED" : "PUTAWAY", entity:lpn,
              lot:s.lines[0]?.lot, sku:s.lines[0]?.sku, cases:0,
              from:s.loc, to, user:mv.user.value});
      out.innerHTML = `<div class="flash"><span class="mono">${esc(lpn)}</span> → <span class="mono">${esc(to)}</span>${warn}
        <br><a class="id" data-id="${lpn}">Open pallet →</a></div>`;
      mv.reset(); info.innerHTML=""; mv.lpn.focus();
      renderNav();
    });
    mv.lpn.focus();
  }
}

/* ── search box ─────────────────────────────────────────────────────────── */
const q = document.getElementById("q");
let tmr;
q.addEventListener("input", ()=>{
  clearTimeout(tmr);
  tmr = setTimeout(()=>{
    lastQuery = q.value;
    if (!lastQuery.trim()) { if (current==="search") go("dash"); return; }
    go("search");
  }, 90);
});
q.addEventListener("keydown", e=>{
  if (e.key === "Enter"){
    const first = document.querySelector("#view .res");
    if (first) { openRec(first.dataset.id); }
    // a full scanned ID goes straight to the record
    const exact = resolve(q.value.trim().toUpperCase());
    if (exact) openRec(q.value.trim().toUpperCase());
  }
  if (e.key === "Escape"){ q.value=""; q.blur(); go("dash"); }
});
document.addEventListener("keydown", e=>{
  if (e.key === "/" && document.activeElement !== q &&
      !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); q.focus(); q.select();
  }
  if (e.key === "Escape") close();
});
document.getElementById("scrim").addEventListener("click", close);
document.getElementById("reset").addEventListener("click", ()=>{
  if (!confirm("Reset all demo data back to the seeded warehouse?")) return;
  localStorage.removeItem(STORE_KEY); DB = seed(); bust(); save();
  q.value = ""; lastQuery = ""; close(); go("dash");
});

/* ── boot ───────────────────────────────────────────────────────────────── */
load();
render();
</script>
</body>
</html>
